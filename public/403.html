<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Acesso Negado - UltimateTV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b1120;
      color: #fff;
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 100px;
      height: 100vh;
      overflow: hidden;
    }
    
    .dtv-error-layout {
      max-width: 800px;
    }
    
    .dtv-badge {
      display: inline-block;
      background-color: #f59e0b;
      color: #000;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    
    h2 {
      font-size: 2.5rem;
      font-weight: 800;
      margin: 0 0 15px 0;
      color: #fff;
    }
    
    p.message {
      font-size: 1.15rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin: 0 0 40px 0;
      max-width: 700px;
    }
    
    .dtv-device-info {
      display: flex;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 20px;
      gap: 20px;
      max-width: 650px;
    }
    
    .dtv-icon {
      font-size: 2.5rem;
    }
    
    .dtv-device-info strong {
      display: block;
      color: #3b82f6;
      font-size: 1rem;
      margin-bottom: 5px;
    }
    
    .ua-string {
      font-size: 0.9rem;
      color: #94a3b8;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="dtv-error-layout">
    <span class="dtv-badge">ERRO 6</span>
    <h2>Dispositivo não autorizado</h2>
    <p class="message">Seu dispositivo não está habilitado para uso do UltimateTV. Contate o administrador da rede para mais informações.</p>
    
    <div class="dtv-device-info">
      <span class="dtv-icon">💻</span>
      <div>
        <strong>ID do Dispositivo:</strong>
        <div id="dtv-user-agent" class="ua-string">Carregando...</div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('dtv-user-agent').textContent = navigator.userAgent;
  </script>
</body>
</html>

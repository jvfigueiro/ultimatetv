<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Acesso Negado - UltimateTV</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    
    .error-container {
      text-align: center;
      max-width: 600px;
      padding: 50px 40px;
      background: rgba(20, 20, 20, 0.95);
      border: 2px solid #222;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    
    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 30px;
      color: #aaa;
      letter-spacing: -1px;
    }
    
    .logo span {
      color: #e50914;
    }
    
    .code {
      font-size: 5rem;
      font-weight: 900;
      color: #ff3b30;
      margin: 0;
      text-shadow: 0 0 20px rgba(255, 59, 48, 0.3);
    }
    
    .msg {
      font-size: 1.8rem;
      margin-top: 15px;
      margin-bottom: 25px;
      color: #ddd;
      font-weight: 600;
    }
    
    .sub {
      font-size: 1.1rem;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="logo">Ultimate<span>TV</span></div>
    <p class="code">Cód. 6</p>
    <p class="msg">Dispositivo não autorizado.</p>
    <p class="sub">Este endereço de IP não possui habilitação ativa no servidor.<br>Contate o administrador da sua rede local.</p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UltimateTV - Configurações</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/settings.css" />
</head>
<body>

  <div class="stb-screen">

    <!-- HEADER -->
    <div class="stb-header">
      <div>
        <h1 class="stb-title">Configurações do Sistema</h1>
        <p class="stb-subtitle">Modifique os parâmetros do sistema. Pressione Voltar no controle para retornar.</p>
      </div>
      <div class="stb-logo">Ultimate<span>TV</span></div>
    </div>
    <hr class="stb-divider" />

    <!-- MAIN BODY -->
    <div class="stb-body">

      <!-- LEFT: Configuration Fields -->
      <div class="stb-fields">
        <table class="cfg-table">
          <tbody>

            <tr class="cfg-row" data-index="0">
              <td class="cfg-label">Endereço do Servidor <span class="cfg-hint">(IP:Porta)</span></td>
              <td class="cfg-control">
                <input type="text" id="input-server" class="stb-input" placeholder="http://10.0.7.25:9191" />
              </td>
            </tr>

            <tr class="cfg-row" data-index="1">
              <td class="cfg-label">Duração da Tarja <span class="cfg-hint">(OSD)</span></td>
              <td class="cfg-control">
                <select id="select-osd" class="stb-select">
                  <option value="3000">3 Segundos</option>
                  <option value="5000">5 Segundos</option>
                  <option value="7000">7 Segundos</option>
                  <option value="10000">10 Segundos</option>
                </select>
              </td>
            </tr>

            <tr class="cfg-row" data-index="2">
              <td class="cfg-label">Proteção por Senha</td>
              <td class="cfg-control">
                <select id="toggle-auth" class="stb-select">
                  <option value="false">Desativado</option>
                  <option value="true">Ativado</option>
                </select>
              </td>
            </tr>

            <tr class="cfg-row" data-index="3">
              <td class="cfg-label">Senha de Acesso <span class="cfg-hint">(PIN numérico)</span></td>
              <td class="cfg-control">
                <input type="password" id="input-pin" class="stb-input stb-input--pin"
                       maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="••••" />
              </td>
            </tr>

          </tbody>
        </table>

        <!-- System Info (read-only, non-focusable) -->
        <div class="sys-info" tabindex="-1" aria-hidden="true">
          <div class="sys-info-row">
            <span class="sys-info-label">Versão do Sistema</span>
            <span id="sysinfo-version" class="sys-info-value">—</span>
          </div>
          <div class="sys-info-row">
            <span class="sys-info-label">ID do Dispositivo</span>
            <span id="sysinfo-ua" class="sys-info-value sys-info-ua">—</span>
          </div>
        </div>

      </div>

      <!-- RIGHT: Action Buttons -->
      <div class="stb-actions">
        <button id="btn-save"   class="stb-btn stb-btn--primary"   data-index="4">Salvar e Reiniciar</button>
        <button id="btn-cancel" class="stb-btn stb-btn--secondary" data-index="5">Cancelar</button>
        <button id="btn-update" class="stb-btn stb-btn--warning"   data-index="6">Atualizar App</button>
      </div>

    </div><!-- /stb-body -->

  </div><!-- /stb-screen -->

  <script type="module" src="/src/settings.js"></script>
</body>
</html>

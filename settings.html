<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UltimateTV - Configurações</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/settings.css" />
</head>
<body>
  <div class="settings-container">
    <div class="settings-header">
      <h1>Configurações do Sistema</h1>
      <p>Modifique os parâmetros do UltimateTV. Reinício automático ao salvar.</p>
    </div>

    <div class="settings-body">
      <div class="form-group">
        <label for="input-server">Endereço do Dispatcharr (IP:Porta)</label>
        <input type="text" id="input-server" placeholder="http://10.0.7.25:9191" />
      </div>

      <div class="form-group">
        <label for="select-osd">Duração da Tarja (OSD)</label>
        <select id="select-osd">
          <option value="3000">3 Segundos</option>
          <option value="5000">5 Segundos</option>
          <option value="7000">7 Segundos</option>
          <option value="10000">10 Segundos</option>
        </select>
      </div>

      <div class="form-group">
        <label for="toggle-auth">Controle de Acesso (Requer PIN para Configurações)</label>
        <select id="toggle-auth">
          <option value="false">Desativado (Modo Livre)</option>
          <option value="true">Ativado (Exigir PIN no Boot)</option>
        </select>
      </div>

      <div class="form-group" id="pin-group">
        <label for="input-pin">Novo PIN de Administrador (4 dígitos numéricos)</label>
        <input type="text" id="input-pin" maxlength="4" placeholder="1234" />
      </div>
      
      <div class="form-actions">
        <button id="btn-save" class="btn btn-primary">Salvar e Reiniciar</button>
        <button id="btn-cancel" class="btn btn-secondary">Cancelar</button>
        <button id="btn-update" class="btn btn-warning">Atualizar App</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/settings.js"></script>
</body>
</html>
